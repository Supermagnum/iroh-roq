[package]
name = "iroh-roq"
version = "0.1.0"
edition = "2021"
readme = "README.md"
description = "RTP over iroh"
license = "MIT OR Apache-2.0"
authors = ["n0 team"]
repository = "https://github.com/Supermagnum/iroh-roq"

# Matches Saga / iroh 1.0 MSRV floor (iroh 1.0.2 requires >= 1.91).
rust-version = "1.91"

[dependencies]
anyhow = "1.0.98"
bytes = "1"
iroh = { version = "1.0", default-features = false, features = ["tls-ring"] }
n0-future = "0.1.3"
# QUIC varint encode/decode (iroh 1.x uses noq; replaces iroh-quinn-proto).
noq-proto = { version = "=1.0.1", default-features = false }
rtp = "0.13"
tokio = { version = "1.45.1", features = ["sync"] }
tokio-util = "0.7.15"
tracing = "0.1.41"
webrtc-util = { version = "0.11", default-features = false, features = [
    "marshal",
] }

[dev-dependencies]
opus = "0.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
